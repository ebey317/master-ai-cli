# Ruff configuration — master-ai-ci
# (`ruff.toml` IS the ruff namespace — settings live at top level,
#  sub-tables drop the [tool.ruff.*] prefix used in pyproject.toml)
# Scope: real defects + import hygiene; opinion rules (ANN/ARG/EM/TRY/etc.)
# excluded deliberately — CLI product, prints/asserts are the working style.
select = ["E", "W", "F", "C", "N", "I", "B", "RET", "SIM", "UP", "YTT"]
ignore = ["E501", "E701", "E702", "C901", "SIM105", "Q000", "Q003"]
line-length = 88

# Format
[format]
line-ending = "lf"
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false