[project]
name = "thread-factory"
version = "0.1.0"
description = "Curate AI chat sessions into published, pruned, audited GitHub repos"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
thread-factory = "thread_factory:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "--timeout=60 --tb=short -v --cov=master_ai --cov=sensei_tui --cov=approval_queue --cov=hooks --cov=capabilities --cov=observability --cov=router --cov=subagent_registry --cov=skill_runtime --cov=tts_server --cov=typed_actions --cov=verifiers --cov=whereisit --cov=thread_factory --cov-report=term-missing --cov-report=html"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Test directory — scan the whole repo, not just tests/.
# 2026-09-20: was ["tests"] (3 files, 14 tests). The other ~60 test files
# at the repo root (775 tests) never ran in CI. Now scans everything.
testpaths = ["."]

# Ignore directories
norecursedirs = [".git", "__pycache__", "build", "dist", "*.egg-info"]

# Ensure the repo-local master_ai.py is imported, not ~/scripts/master_ai.py
pythonpath = ["."]

# Disable warnings
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
