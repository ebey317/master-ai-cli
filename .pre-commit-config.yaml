# Pre-commit configuration
repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.4.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  # 2026-09-14: black removed -- it and ruff-format disagree on ~50
  # pre-existing formatting choices scattered across master_ai.py
  # (f-string comma spacing, string-wrap style, etc.), and running both
  # on every commit meant each one endlessly "fixed" what the other had
  # just "fixed," blocking any commit to that file. ruff-format is the
  # project's primary formatter (ruff already does the linting); having
  # a second, competing formatter was redundant, not additive.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        # 2026-09-14: mypy follows the full import graph by default, so
        # checking one changed file (e.g. master_ai.py) also type-checks
        # every module it imports. Several of those (typed_actions.py,
        # learning_loop.py, skill_marketplace.py, sensei_mcp_client.py,
        # skill_improve_helpers.py) carry ~51 pre-existing, unrelated type
        # errors that were silently blocking ANY commit touching
        # master_ai.py. --follow-imports=silent restricts checking to the
        # files actually being committed; it does not fix or hide those
        # modules' own errors when THEY are the ones being committed.
        #
        # 2026-09-25: dropped `--exclude sensei_clean/__init__.py`, added
        # here to work around the sensei_clean.py / sensei_clean/ package
        # name collision. It never actually worked -- mypy's --exclude
        # only applies to files it discovers itself; pre-commit passes
        # every matched file as an explicit argument via `--all-files`,
        # which bypasses --exclude entirely, so the "Duplicate module
        # named sensei_clean" error kept firing regardless. Root cause
        # fixed properly instead: the colliding top-level script is
        # renamed to sensei_clean_cli.py, so there's no longer a real
        # collision for any exclude flag to work around.
        args: [--ignore-missing-imports, --follow-imports=silent]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
