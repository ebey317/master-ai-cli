# Pre-commit configuration
repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    # 2026-09-28: bumped 0.4.1 -> 0.16.7 to match the ruff on this machine.
    # The two disagree on formatting, and a mismatch is not a cosmetic
    # annoyance: running the local ruff, committing, and having the hook
    # "fix" the same lines back produces a commit loop that blocks every
    # commit touching a .py file. Whatever formats the code locally must be
    # what the hook formats it with, or nothing lands.
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  # 2026-09-14: black removed -- it and ruff-format disagree on ~50
  # pre-existing formatting choices scattered across master_ai.py
  # (f-string comma spacing, string-wrap style, etc.), and running both
  # on every commit meant each one endlessly "fixed" what the other had
  # just "fixed," blocking any commit to that file. ruff-format is the
  # project's primary formatter (ruff already does the linting); having
  # a second, competing formatter was redundant, not additive.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        # 2026-09-28: the hook's default "docker_image" language has no
        # docker on this box, and its "entry" is the docker image name
        # itself (koalaman/shellcheck:v0.10.0), not a runnable command --
        # overriding language alone made pre-commit try to exec that image
        # string as a binary. shellcheck is already installed locally
        # (~/.local/bin/shellcheck); override entry to the real binary too.
        language: system
        entry: shellcheck
  - repo: local
    hooks:
      - id: mypy-baseline
        name: mypy (baselined -- new errors only)
        # 2026-09-29: this replaces the mirrors-mypy hook, which never
        # completed a single run.
        # ./conftest.py and ./tests/conftest.py are both top-level modules
        # named `conftest`; mypy aborts with "Duplicate module named
        # conftest" and reports "errors prevented further checking", so
        # NOTHING was type-checked, ever. Its own comment predicted this
        # would eventually be fixed by renaming files, but the real
        # duplicate-conftest collision was missed entirely.
        #
        # Fixing it exposes 203 pre-existing errors (107 unique
        # file|code|message) -- accumulated debt, not regressions, since
        # there was never a working gate to regress from. Requiring zero
        # before a release would mean rewriting a 26k-line monolith, which
        # is a far bigger risk to the ship than the errors are.
        #
        # tools/mypy_gate.py therefore baselines the existing debt and fails
        # only on NEW errors, so the codebase can only ratchet forward.
        # Replaces the mirror hook (one source of truth for the tool
        # version -- mypy==1.10.0 is pinned in the dev extra, matching the
        # rev this hook used).
        entry: python tools/mypy_gate.py
        language: system
        types: [python]
        require_serial: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
