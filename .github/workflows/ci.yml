# GitHub Actions CI workflow
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -e .[dev]
        pip install ruff pytest pytest-cov pytest-timeout pre-commit mypy

    - name: Install shellcheck (native binary, not on PyPI)
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Run pre-commit
      run: |
        pre-commit install
        pre-commit run --all-files

    - name: Run shellcheck
      run: |
        shellcheck --external-sources *.sh

    - name: Run mypy
      run: |
        mypy --ignore-missing-imports --follow-imports=silent --exclude '^appforge/templates/' .

    - name: Run ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Run pytest
      env:
        MCLI_SKIP_ENV_TESTS: "1"
      run: |
        pytest --tb=short -v --timeout=60

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: htmlcov/

  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install ruff

    - name: Run ruff
      run: |
        ruff check .
        ruff format --check .
